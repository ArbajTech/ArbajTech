name: Update Profile Card Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update SVG stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os, re, json, urllib.request
          from datetime import datetime, timedelta, timezone

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "User-Agent": "profile-card-updater"
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          profile = get(f"https://api.github.com/users/{user}")
          repos = []
          page = 1
          while True:
              batch = get(
                  f"https://api.github.com/users/{user}/repos"
                  f"?type=owner&per_page=100&page={page}"
              )
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          repos_count = profile["public_repos"]
          stars = sum(r["stargazers_count"] for r in repos)
          forks = sum(r["forks_count"] for r in repos)
          followers = profile["followers"]

          end = datetime.now(timezone.utc)
          start = end - timedelta(days=365)
          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                totalPullRequestReviewContributions
                totalRepositoriesWithContributedCommits
              }
            }
          }
          """
          payload = {
              "query": query,
              "variables": {
                  "login": user,
                  "from": start.isoformat(),
                  "to": end.isoformat()
              }
          }
          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps(payload).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req) as r:
              result = json.load(r)

          if result.get("errors"):
              raise RuntimeError(result["errors"])

          c = result["data"]["user"]["contributionsCollection"]
          commits = c["totalCommitContributions"]
          prs = c["totalPullRequestContributions"]
          issues = c["totalIssueContributions"]
          reviews = c["totalPullRequestReviewContributions"]
          contributed = c["totalRepositoriesWithContributedCommits"]
          contributions = commits + prs + issues + reviews

          values = {
              "253": [repos_count, stars],
              "273": [forks, followers],
              "293": [commits, contributed],
              "313": [prs, issues],
              "373": [contributions, reviews],
          }

          path = "dark_mode.svg"
          with open(path, encoding="utf-8") as f:
              lines = f.readlines()

          for i, line in enumerate(lines):
              for y, nums in values.items():
                  if f'y="{y}.' in line:
                      matches = list(re.finditer(
                          r'(<tspan fill="#79c0ff">)[^<]*(</tspan>)',
                          line
                      ))
                      if len(matches) >= 2:
                          for match, number in zip(matches[-2:], nums):
                              pass
                          for match, number in reversed(
                              list(zip(matches[-2:], nums))
                          ):
                              line = (
                                  line[:match.start()]
                                  + match.group(1) + str(number) + match.group(2)
                                  + line[match.end():]
                              )
                          lines[i] = line

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(lines)
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          git commit -m "Update profile card stats" || exit 0
          git push
